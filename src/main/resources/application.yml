spring:
  application:
    name: incident-management

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/incident_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      # Never "update"/"create" in real use — migrations belong in a tool
      # like Flyway. "validate" is used here as a deliberately safer
      # fresher-project default: it will fail fast on startup instead of
      # silently mutating the schema. See DB_SCHEMA_MODE below for local dev.
      ddl-auto: ${DB_SCHEMA_MODE:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: never
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-of-at-least-32-bytes-before-deploying}
  expiration: ${JWT_EXPIRATION_MS:86400000} # 24h

groq:
  api:
    key: ${GROQ_API_KEY:}
    url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
  model: ${GROQ_MODEL:llama-3.1-8b-instant}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.karthik.incidentmanagement: ${LOG_LEVEL:INFO}
